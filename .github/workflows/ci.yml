name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - if: matrix.python-version != '3.10'
        name: Qualify hardware export with deployed compiler version
        run: |
          python -m pip install -e ".[dev]" "rqm-compiler==0.3.0"
          pytest tests/test_hardware_export.py tests/test_export.py
      - if: matrix.python-version != '3.10'
        run: python -m pip install --force-reinstall --no-deps "rqm-compiler @ git+https://github.com/RQM-Technologies-dev/rqm-compiler.git@55faa4e654f2a935255e174fe5722cd9396ac6f2"
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build "twine>=6.0"
      - run: python -m build
      - run: python -m twine check dist/*
